spring:
  application:
    name: banking-application

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:banking_app}
    password: ${DB_PASSWORD:akhil}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

security:
  jwt:
    secret: Zo+p2QJKQy6kmeeiopOwfz8oYoO01scWtwJQcU4hyds=
    issuer: banking-application
    access-token-ttl: 15m